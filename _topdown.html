<!DOCTYPE html>
<html><head>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/",
               "@mapbox/vector-tile": "./vendor/vector-tile.js", "pbf": "./vendor/pbf.js" } }
</script>
</head><body style="margin:0;background:#18202b;overflow:hidden">
<canvas id="c"></canvas>
<pre id="out" style="position:fixed;left:0;top:0;margin:0;color:#fff;font:11px monospace;background:#0008"></pre>
<script src="data/lamp_grid.js"></script>
<script src="data/tree_grid.js"></script>
<script type="module">
const out = document.getElementById("out");
const q = new URLSearchParams(location.search);
try {
  const THREE = await import("three");
  const { World3D } = await import("./js/world3d.js?v=td" + Date.now());
  const { CellIndex } = await import("./js/geo.js?v=20261125r");
  const { ROAD_WIDTH_M } = await import("./js/style.js");
  const feats = await (await fetch("_loop-features.json")).json();
  const W = innerWidth, H = innerHeight;
  const canvas = document.getElementById("c"); canvas.width = W; canvas.height = H;
  const gl = canvas.getContext("webgl2", { antialias: true });
  const map = {
    center: { lng: -87.62333, lat: 41.88266 }, zoom: 18,
    querySourceFeatures: (src, { sourceLayer }) => feats[sourceLayer] || [],
    getCanvas: () => canvas, triggerRepaint() {}, getCenter() { return this.center; }, getZoom() { return this.zoom; },
  };
  const world = new World3D(map, { lampIndex: new CellIndex(window.__LAMP_GRID__.cells), treeIndex: new CellIndex(window.__TREE_GRID__.cells) });
  world.onAdd(map, gl);
  world.setMode("day", { altitude: 0.8, bearing: 180 });
  world.rebuild(false, [map.center.lng, map.center.lat]);
  while (world.job) world.stepJob(1000);
  const u = world.uniforms;
  u.uFade.value = 1; u.uRise.value = 1; u.uViewport.value.set(W, H); u.uFog.value.set(5000, 9000);
  // draw what MapLibre draws at street zoom: pavement, kerb, asphalt, true width
  const gs = new THREE.Scene();
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), new THREE.MeshBasicMaterial({ color: 0xebe1ca, depthWrite: false }));
  gs.add(ground);
  const ribbon = (extra, color) => {
    const pos = [];
    for (const f of feats.transportation) {
      const w = ROAD_WIDTH_M[f.properties.class];
      if (!w || ["path", "track", "motorway"].includes(f.properties.class) || f.properties.brunnel === "tunnel") continue;
      const g = f.geometry, lines = g.type === "LineString" ? [g.coordinates] : g.type === "MultiLineString" ? g.coordinates : [];
      const half = w / 2 + extra;
      for (const line of lines) {
        const pts = line.map(([lng, lat]) => world.frame.toLocal(lng, lat));
        for (let i = 1; i < pts.length; i++) {
          const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
          const L = Math.hypot(bx - ax, by - ay) || 1, nx = -(by - ay) / L * half, ny = (bx - ax) / L * half;
          pos.push(ax + nx, ay + ny, 0, bx + nx, by + ny, 0, bx - nx, by - ny, 0, ax + nx, ay + ny, 0, bx - nx, by - ny, 0, ax - nx, ay - ny, 0);
        }
        // round joins, like MapLibre's line-join: round
        for (const [x, y] of pts) for (let k = 0; k < 10; k++) {
          const a0 = (k / 10) * 6.283, a1 = ((k + 1) / 10) * 6.283;
          pos.push(x, y, 0, x + Math.cos(a0) * half, y + Math.sin(a0) * half, 0, x + Math.cos(a1) * half, y + Math.sin(a1) * half, 0);
        }
      }
    }
    const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    gs.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, depthWrite: false, side: THREE.DoubleSide })));
  };
  ribbon(3.5, 0xd8d1c3); ribbon(0.35, 0xb5ad9e); ribbon(0, 0x7f7c77);
  let cam;
  if (q.get("cam")) {
    const [px, py, pz, tx, ty, tz] = q.get("cam").split(",").map(Number);
    cam = new THREE.PerspectiveCamera(50, W / H, 0.5, 5000); cam.up.set(0, 0, 1); cam.position.set(px, py, pz); cam.lookAt(tx, ty, tz);
  } else {
    const [cx, cy, h] = (q.get("at") || "-180,120,170").split(",").map(Number);
    cam = new THREE.PerspectiveCamera(30, W / H, 1, 5000); cam.up.set(0, 1, 0); cam.position.set(cx, cy, h); cam.lookAt(cx, cy, 0);
  }
  const r = world.renderer; r.setClearColor(0xebe1ca, 1); r.clear();
  r.render(gs, cam); r.clearDepth();
  // only the ground markings (and buildings for context)
  if (!q.get("all")) for (const [k, m] of Object.entries(world.meshes)) m.visible = ["crossings", "markings", "buildings"].includes(k);
  else { for (let i = 0; i < 60; i++) { world.time += 1 / 30; world.updateAgents(1 / 30); } world.uniforms.uTime.value = world.time; }
  world.mats.building.uniforms.uRise.value = 1;
  r.render(world.scene, cam);
  out.textContent = `crossings ${world.state.crossings.length}`;
} catch (e) { out.textContent = "EXC " + (e.stack || e); }
document.title = "done";
</script>
</body></html>
